<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengkel Jaya | Manajemen Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Bengkel Jaya</h1>
            <p>Sistem Informasi Manajemen Bengkel</p>
        </div>
    </header>

    <nav class="nav-tabs container">
        <button class="tab-button active" data-entity="sparepart" type="button">Sparepart</button>
        <button class="tab-button" data-entity="karyawan" type="button">Karyawan</button>
        <button class="tab-button" data-entity="pelanggan" type="button">Pelanggan</button>
    </nav>

    <main class="container">
        <section class="page-heading">
            <div>
                <h2 id="pageTitle">Data Sparepart</h2>
                <p id="pageSubtitle">Kelola persediaan sparepart bengkel.</p>
            </div>
            <div class="heading-actions">
                <button id="refreshButton" type="button" class="btn-secondary">Muat Ulang</button>
                <button id="addButton" type="button">+ Tambah Data</button>
            </div>
        </section>

        <p id="statusMessage" role="status">Memuat data...</p>

        <!-- Modal tambah / ubah -->
        <div id="formModal" class="modal-overlay hidden">
            <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="formTitle">
                <div class="form-card-header">
                    <h3 id="formTitle">Tambah Data</h3>
                    <button id="closeFormButton" type="button" class="btn-close" aria-label="Tutup">&times;</button>
                </div>
                <form id="dataForm">
                    <div id="formFields" class="form-grid"></div>
                    <div class="form-actions">
                        <button type="submit" id="submitButton">Simpan</button>
                        <button type="button" id="cancelButton" class="btn-secondary">Batal</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabel data -->
        <div class="table-wrapper">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="9">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="container footer">
        <p>&copy; 2026 Bengkel Jaya</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
